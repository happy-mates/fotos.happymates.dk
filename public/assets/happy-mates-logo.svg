<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 750" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Happy Mates</title>
  <desc id="logo-desc">Left circle of the Happy Mates infinity symbol with smiley face</desc>
  
  <defs>
    
    <linearGradient id="leftGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E63946;stop-opacity:1"></stop>
      <stop offset="25%" style="stop-color:#F77F00;stop-opacity:1"></stop>
      <stop offset="50%" style="stop-color:#FCBF49;stop-opacity:1"></stop>
      <stop offset="75%" style="stop-color:#06D6A0;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#118AB2;stop-opacity:1"></stop>
    </linearGradient>
  </defs>
  
  
  <circle cx="375" cy="375" r="300" fill="url(#leftGradient)" stroke="none"></circle>
  
  
  <circle cx="375" cy="375" r="200" fill="white"></circle>
  
  
  
  <circle cx="330" cy="330" r="30" fill="black"></circle>
  
  <circle cx="420" cy="300" r="30" fill="black"></circle>
  
  <path d="M 310 410 Q 375 470 440 410" stroke="black" stroke-width="25" fill="none" stroke-linecap="round"></path>
